<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Ethan Kong | Links</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Epilogue:wght@300;400&family=Noto+Serif+SC:wght@700&family=Petit+Formal+Script&family=Zhi+Mang+Xing&display=swap');
        
        :root {
            --holographic-bg: #f8fafc;
            --text-main: #4b5563;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--holographic-bg);
            color: var(--text-main);
            margin: 0;
            overflow: hidden;
            position: relative;
        }

        /* Iridescent Background Effect */
        body::before {
            content: "";
            position: fixed;
            inset: 0;
            background: 
                radial-gradient(circle at 10% 10%, rgba(153, 246, 228, 0.6) 0%, transparent 50%),
                radial-gradient(circle at 90% 10%, rgba(251, 207, 232, 0.6) 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, rgba(254, 243, 199, 0.4) 0%, transparent 60%),
                radial-gradient(circle at 80% 80%, rgba(233, 213, 255, 0.6) 0%, transparent 50%),
                url('{{DATA:IMAGE:IMAGE_1}}');
            background-size: cover;
            background-position: center;
            opacity: 0.4;
            filter: blur(40px);
            z-index: -1;
        }

        /* Intro Overlay Styles */
        #intro-overlay {
            position: fixed;
            inset: 0;
            background-color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            animation: fadeOutOverlay 0.8s ease-in-out forwards;
            animation-delay: 3.5s; /* Reduced from 5s */
        }

        .welcome-text {
            font-family: 'Zhi Mang Xing', cursive;
            font-weight: 400;
            font-size: 6rem;
            letter-spacing: 0.1em;
            opacity: 0;
            background: linear-gradient(135deg, #2dd4bf, #f472b6, #c084fc, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: floatUpDown 3s ease-in-out forwards; /* Reduced duration from 4.5s */
        }

        .welcome-caption {
            font-family: 'Petit Formal Script', cursive;
            font-size: 1.5rem;
            letter-spacing: 0.2em;
            opacity: 0;
            background: linear-gradient(135deg, #2dd4bf, #f472b6, #c084fc, #fbbf24);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: floatUpDown 3s ease-in-out forwards; /* Reduced duration from 4.5s */
            animation-delay: 0.2s; /* Slightly tighter delay */
            margin-top: 1rem;
        }

        /* Main Content Animation */
        .reveal {
            opacity: 0;
            transform: translateY(20px);
        }

        .reveal.active {
            animation: fadeInFloatUp 1s ease-out forwards;
        }

        .link-card {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1);
            backdrop-filter: blur(16px);
            position: relative;
            overflow: hidden;
        }

        .link-card::after {
            content: '';
            position: absolute;
            top: -50%;
            left: -50%;
            width: 200%;
            height: 200%;
            background: linear-gradient(45deg, transparent, rgba(255,255,255,0.4), transparent);
            transform: rotate(45deg);
            transition: 0.6s;
            pointer-events: none;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.7);
            transform: translateY(-2px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.9);
            box-shadow: 0 10px 30px -10px rgba(0,0,0,0.05);
        }

        .link-card:hover::after {
            left: 100%;
        }

        @keyframes floatUpDown {
            0% { opacity: 0; transform: translateY(40px); }
            20% { opacity: 1; transform: translateY(0); }
            80% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-40px); }
        }

        @keyframes fadeOutOverlay {
            to { visibility: hidden; opacity: 0; }
        }

        @keyframes fadeInFloatUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            .welcome-text { font-size: 4.5rem; }
            .welcome-caption { font-size: 1.2rem; }
        }
    </style>
</head>
<body class="min-h-screen">
<!-- Intro Animation Overlay -->
<div class="flex-col" id="intro-overlay">
<h1 class="welcome-text">恐龙城</h1>
<p class="welcome-caption">Dinosaur City</p>
</div>
<!-- Main Landing Page -->
<main class="flex flex-col items-center justify-center min-h-screen px-6 py-12 relative z-10" id="main-content">
<!-- Header Info -->
<div class="text-center mb-12 reveal" id="header-reveal">
<h1 class="text-4xl font-light tracking-wide mb-4" style="font-family: 'Petit Formal Script', cursive;">Ethan Kong</h1>
<p class="text-[10px] uppercase tracking-[0.35em] text-gray-500 font-medium">Researcher &amp; Content Creator</p>
<div class="h-[1px] w-12 bg-gradient-to-r from-teal-200 via-pink-200 to-purple-200 mx-auto mt-8 opacity-60"></div>
</div>
<!-- Links Container -->
<div class="w-full max-w-sm space-y-4">
<!-- LinkedIn -->
<a class="link-card reveal block w-full py-5 px-8 rounded-full text-center group" href="https://www.linkedin.com/in/ethan-kong-88999933b/" style="animation-delay: 0.1s;" target="_blank">
<span class="text-base tracking-[0.2em] uppercase font-semibold text-black group-hover:tracking-[0.3em] transition-all">LinkedIn</span>
</a>
<!-- CV -->
<a class="link-card reveal block w-full py-5 px-8 rounded-full text-center group" href="resume.pdf" style="animation-delay: 0.2s;" target="_blank">
<span class="text-base tracking-[0.2em] uppercase font-semibold text-black group-hover:tracking-[0.3em] transition-all">Curriculum Vitae</span>
</a>
<!-- Instagram -->
<a class="link-card reveal block w-full py-5 px-8 rounded-full text-center group" href="https://www.instagram.com/atypicaldinosaur?igsh=MWpyam5wZHJoOXh1ZQ%3D%3D&amp;utm_source=qr" style="animation-delay: 0.3s;" target="_blank">
<span class="text-base tracking-[0.2em] uppercase font-semibold text-black group-hover:tracking-[0.3em] transition-all">Instagram</span>
</a>
<!-- TikTok -->
<a class="link-card reveal block w-full py-5 px-8 rounded-full text-center group" href="https://www.tiktok.com/@atypicaldinosaur?_r=1&amp;_t=ZS-963MB46IpgD" style="animation-delay: 0.4s;" target="_blank">
<span class="text-base tracking-[0.2em] uppercase font-semibold text-black group-hover:tracking-[0.3em] transition-all">TikTok</span>
</a>
</div>
<footer class="mt-20 text-[9px] uppercase tracking-[0.5em] text-gray-400 text-center reveal" style="animation-delay: 0.6s;">
            Hwa Chong Institution<br/>
<span class="mt-3 block opacity-70">2026</span>
</footer>
</main>
<script>
        // Sequence the animations after the intro
        window.addEventListener('DOMContentLoaded', () => {
            const INTRO_DURATION = 3900; // Reduced from 6000 to match shorter CSS delays (3.5s delay + some of 0.8s fade)

            setTimeout(() => {
                document.body.style.overflow = 'auto';
                
                const elements = document.querySelectorAll('.reveal');
                elements.forEach((el, index) => {
                    setTimeout(() => {
                        el.classList.add('active');
                    }, index * 100); // Slightly faster stagger
                });
            }, INTRO_DURATION);
        });
    </script>
</body></html>
