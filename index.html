<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ethan Kong | Links</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Epilogue:wght@300;400&family=Petit+Formal+Script&display=swap');
        
        :root {
            --pastel-grey: #e5e7eb;
            --text-main: #4b5563;
        }

        body {
            font-family: 'Epilogue', sans-serif;
            background-color: var(--pastel-grey);
            color: var(--text-main);
            margin: 0;
            overflow: hidden;
        }

        /* Intro Overlay Styles */
        #intro-overlay {
            position: fixed;
            inset: 0;
            background-color: var(--pastel-grey);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 50;
            animation: fadeOutOverlay 0.8s ease-in-out forwards;
            animation-delay: 1.8s;
        }

        .welcome-text {
            font-family: 'Petit Formal Script', cursive;
            font-size: 4rem;
            opacity: 0;
            animation: fadeInOut 1.8s ease-in-out forwards;
        }

        /* Main Content Animation */
        #main-content {
            opacity: 0;
            animation: fadeInMain 1s ease-in-out forwards;
            animation-delay: 2.4s;
        }

        .link-card {
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid rgba(255, 255, 255, 0.6);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            backdrop-filter: blur(4px);
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.9);
            transform: scale(1.015);
            border-color: rgba(255, 255, 255, 1);
        }

        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(10px); }
            30% { opacity: 1; transform: translateY(0); }
            70% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-10px); }
        }

        @keyframes fadeOutOverlay {
            to { visibility: hidden; opacity: 0; }
        }

        @keyframes fadeInMain {
            from { opacity: 0; transform: translateY(15px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @media (max-width: 640px) {
            .welcome-text { font-size: 2.8rem; }
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Intro Animation Overlay -->
    <div id="intro-overlay">
        <h1 class="welcome-text">Welcome</h1>
    </div>

    <!-- Main Landing Page -->
    <main id="main-content" class="flex flex-col items-center justify-center min-h-screen px-6 py-12">
        
        <!-- Header Info -->
        <div class="text-center mb-10">
            <h1 class="text-xl font-light tracking-[0.2em] uppercase mb-2">Ethan Kong</h1>
            <p class="text-[10px] uppercase tracking-[0.3em] text-gray-400">Researcher & Content Creator</p>
            <div class="h-[1px] w-8 bg-gray-300 mx-auto mt-6"></div>
        </div>

        <!-- Links Container -->
        <div class="w-full max-w-sm space-y-3">
            
            <!-- LinkedIn -->
            <a href="https://www.linkedin.com/in/ethan-kong-88999933b/" target="_blank" class="link-card block w-full py-5 px-8 rounded-full text-center group">
                <span class="text-xs tracking-[0.25em] uppercase font-light group-hover:tracking-[0.35em] transition-all">LinkedIn</span>
            </a>

            <!-- CV (Direct Link to file) -->
            <a href="resume.pdf" target="_blank" class="link-card block w-full py-5 px-8 rounded-full text-center group">
                <span class="text-xs tracking-[0.25em] uppercase font-light group-hover:tracking-[0.35em] transition-all">Curriculum Vitae</span>
            </a>

            <!-- Instagram -->
            <a href="https://www.instagram.com/atypicaldinosaur?igsh=MWpyam5wZHJoOXh1ZQ%3D%3D&utm_source=qr" target="_blank" class="link-card block w-full py-5 px-8 rounded-full text-center group">
                <span class="text-xs tracking-[0.25em] uppercase font-light group-hover:tracking-[0.35em] transition-all">Instagram</span>
            </a>

            <!-- TikTok -->
            <a href="https://www.tiktok.com/@atypicaldinosaur?_r=1&_t=ZS-963MB46IpgD" target="_blank" class="link-card block w-full py-5 px-8 rounded-full text-center group">
                <span class="text-xs tracking-[0.25em] uppercase font-light group-hover:tracking-[0.35em] transition-all">TikTok</span>
            </a>

        </div>

        <footer class="mt-16 text-[9px] uppercase tracking-[0.5em] text-gray-400 text-center">
            Hwa Chong Institution<br>
            <span class="mt-2 block">© 2025</span>
        </footer>
    </main>

    <script>
        // Re-enable scrolling after intro
        setTimeout(() => {
            document.body.style.overflow = 'auto';
        }, 3000);
    </script>
</body>
</html>
